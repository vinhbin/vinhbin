name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF6B35&color_dots=#1A1A1F,#E63946,#FF6B35,#FFB347,#F5F5F5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFB347&color_dots=#1A1A1F,#E63946,#FF6B35,#FFB347,#F5F5F5

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
