<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Featured Builds">
  <title>Featured Builds</title>
  <style>
    .idx { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; letter-spacing: 3px; fill: #FF6B35; }
    .label { font-family: Georgia, "Times New Roman", serif; font-size: 30px; fill: #F5F5F5; }
    @media (prefers-color-scheme: light) { .label { fill: #1A1A1F; } }
    .rule { transform-origin: 303px 32px; transform-box: view-box; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <text class="idx" x="0" y="37">02</text>
  <text class="label" x="40" y="42">Featured Builds</text>
  <rect class="rule" x="303" y="31" width="897" height="2" fill="url(#g)"/>
  <circle cx="303" cy="32" r="3" fill="#FFB347"/>
</svg>
